[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-collection-dl"
version = "0.3.0"
description = "Download mod collections from Nexus Mods"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "py7zr>=0.20.0",
    "rarfile>=4.0",
    "packaging>=21.0",
    # state.py uses typing.Self via typing_extensions, which is not in the
    # stdlib until 3.11 and is not guaranteed to arrive transitively.
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
# There is deliberately no `loot` extra. The libloot Python bindings are not
# published to PyPI, and `pip install loot` resolves to an unrelated GitHub CLI
# helper, so an extra of that name installed the wrong package. Get the real
# bindings by running setup.sh (builds from source) or by installing a libloot
# wheel from one of this repo's releases.
dev = ["pytest>=8.0"]

[project.scripts]
nexus-dl = "nexus_collection_dl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
# Scope discovery to the package itself so tests/ is never packaged into
# wheels or sdists.
include = ["nexus_collection_dl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# BLE001 is off on purpose. Catching Exception at an outer boundary is a
# deliberate design here: service calls, the shell loop, and the web routes
# all keep one catch-all so nothing escapes as a traceback or an invisible
# failure. Narrowing those to specific types would change behavior, so the
# rule fights the code rather than protecting it.
ignore = ["BLE001"]

[tool.mypy]
python_version = "3.10"
# rarfile and the optional loot binding ship without type stubs.
[[tool.mypy.overrides]]
module = ["rarfile", "loot"]
ignore_missing_imports = true

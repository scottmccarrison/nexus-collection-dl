[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-collection-dl"
version = "0.2.1"
description = "Download mod collections from Nexus Mods"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "py7zr>=0.20.0",
    "rarfile>=4.0",
    "flask>=3.0.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
loot = ["loot"]
dev = ["pytest>=8.0"]

[project.scripts]
nexus-dl = "nexus_collection_dl.cli:main"
nexus-dl-web = "nexus_collection_dl.web:main"

[tool.setuptools.packages.find]
where = ["."]
# Scope discovery to the package itself so tests/ is never packaged into
# wheels or sdists.
include = ["nexus_collection_dl*"]

[tool.setuptools.package-data]
"nexus_collection_dl.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# BLE001 is off on purpose. Catching Exception at an outer boundary is a
# deliberate design here: service calls, the shell loop, and the web routes
# all keep one catch-all so nothing escapes as a traceback or an invisible
# failure. Narrowing those to specific types would change behavior, so the
# rule fights the code rather than protecting it.
ignore = ["BLE001"]

[tool.mypy]
python_version = "3.10"
# rarfile and the optional loot binding ship without type stubs.
[[tool.mypy.overrides]]
module = ["rarfile", "loot"]
ignore_missing_imports = true

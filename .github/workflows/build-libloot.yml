name: Build libloot wheel

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pyo3/maturin:latest
    steps:
      - name: Fetch libloot source
        # No package manager here: the maturin image is manylinux-based and
        # has neither apt-get (the old step died on that) nor a live yum
        # mirror (its CentOS 7 base is EOL). Fetch the source without git.
        run: |
          set -e
          URL=https://github.com/loot/libloot/archive/refs/heads/master.tar.gz
          if command -v curl >/dev/null 2>&1; then
            curl -sSL -o /tmp/libloot.tar.gz "$URL"
          else
            python3 -c "import urllib.request; urllib.request.urlretrieve('$URL', '/tmp/libloot.tar.gz')"
          fi
          mkdir -p /tmp/libloot
          tar -xzf /tmp/libloot.tar.gz -C /tmp/libloot --strip-components=1
          test -f /tmp/libloot/python/Cargo.toml
          echo "libloot source ready"

      - name: Set up Rust toolchain
        # The maturin image ships rustup but, in current tags, no default
        # toolchain, so `cargo` refuses to run until one is named.
        run: |
          set -e
          rustup set profile minimal
          rustup default stable
          cargo --version

      - name: Build wheel
        # libloot is a Cargo workspace, so maturin writes wheels to the
        # workspace root target/, not python/target/.
        #
        # Build for the interpreters nexus-collection-dl actually supports.
        # maturin with no -i picks whichever python3 is first on PATH, which
        # is cp39 in this image and would ship a wheel nobody can install.
        #
        # Tag manylinux_2_17 (manylinux2014), which maturin confirms the
        # binary qualifies for; asking for 2_28 only narrows compatibility.
        run: |
          set -e
          cd /tmp/libloot/python
          maturin build --release --strip --manylinux 2_17 \
            -i python3.10 -i python3.11 -i python3.12 -i python3.13
          ls -la /tmp/libloot/target/wheels/

      - name: Upload wheel to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/libloot/target/wheels/*.whl

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: libloot-wheel
          path: /tmp/libloot/target/wheels/*.whl
